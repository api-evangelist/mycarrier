note: 'MyCarrier documents that rate limits EXIST and how to react to them, but publishes
  no numbers. The rate-limits page states that limits are "customized", that "distinct
  rate limits are applied to different API endpoints", and that they are "enforced on
  an account-by-account basis" — without naming a single quota, window or burst value.
  No rate-limit response headers are documented anywhere in the developer docs, and
  none of the six published OpenAPI contracts declares a 429 response or a
  RateLimit/X-RateLimit/Retry-After header. An agent therefore cannot read its remaining
  budget at runtime; it can only observe the 429 and back off. limit_count is 0 because
  zero numeric limits are published, not because limits are absent.'
