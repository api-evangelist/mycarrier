- aid: mycarrier-freightaudit-api
  name: MyCarrier FreightAudit API
  description: 'The MyCarrier FreightAudit (Invoice Hub) API — freight bill audit,
    invoice filtering and retrieval, disputes, notes, tags, bulk import/export, payments
    and remittance, invoice analytics and shipment linking. Bearer JWT on the live
    contract; the documented public subset uses HTTP Basic.'
  humanURL: https://developer.mycarrier.io/docs/getting-started
  baseURL: https://invoice.mycarriertms.com
  tags:
  - Invoicing
  - Freight Audit
  - Payments
