- aid: mycarrier-webhook-api
  name: MyCarrier Webhook Registration API
  description: 'The MyCarrier webhook registration surface (ITM.Services.Webhook.Api)
    — register, update and delete webhook subscriptions, webhook types and additional
    outbound HTTP headers. Bearer JWT. The published contract declares no servers[]
    block, so the host is not stated in the spec.'
  humanURL: https://developer.mycarrier.io/docs/webhooks
