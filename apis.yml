aid: mycarrier
name: MyCarrier
description: 'MyCarrier is a transportation management system (TMS) for less-than-truckload
  (LTL) and full-truckload freight, founded in 2018 by Michael Bookout and Chris Scheid.
  The platform lets shippers quote, book, dispatch, track, audit and pay freight from
  a single connected workspace using direct carrier rates rather than broker markups,
  and connects to more than a dozen national LTL carriers. MyCarrier publishes a public
  REST API on developer.mycarrier.io covering order creation and management, rate quoting
  and dispatch, routing-guide rules, shipping locations, shipment detail retrieval, and
  a FreightAudit / invoice surface for freight bill audit, disputes, notes and payments.
  It also publishes a webhook catalog for shipment and invoice lifecycle events.'
image: https://apporderprocessprodsa.blob.core.windows.net/$web/images/tms-logo.svg
