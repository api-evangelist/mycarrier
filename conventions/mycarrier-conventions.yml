error_envelope:
  styles:
  - name: ApiResponseOf<T>
    shape: '{ data: <T>, errors: [string], statusCode: integer }'
    used_by: public API (addresses, quotes, routing guide, shipments)
    machine_readable_codes: false
    note: '`errors` is a flat array of human strings with no code field.'
  - name: Result
    shape: '{ isSuccess: boolean, errorMessages: [string] }'
    used_by: order operations (400 responses on /api/v1/orders)
    machine_readable_codes: false
  - name: StatusInfo / Note
    shape: '{ message: string, notes: [ { code, message, source, status } ] }'
    used_by: rating and dispatch responses
    machine_readable_codes: true
    note: 'The richest envelope MyCarrier ships. Each Note carries a `code` for
      programmatic handling (documented example "VALIDATION_001"), a `source` enum
      (Carrier | MyCarrier | ThirdParty | Validation) that says WHO rejected the
      request, and a `status` enum (Success | Info | Warning | Error). This is the
      only place a client can tell a carrier-side failure from a MyCarrier-side one.'
  - name: ProblemDetails
    shape: RFC 7807 / RFC 9457 { type, title, status, detail, instance }
    used_by: FreightAudit live contract
    machine_readable_codes: true
    content_type: application/problem+json
  detail: 'Four different error envelopes across the surface. A single client
    integrating orders, rating and invoicing must handle all four.'
  see: errors/mycarrier-problem-types.yml
request_tracing:
  supported: true
  mechanism: W3C Trace Context
  header: Traceparent
  detail: 'Every public API operation declares an optional `Traceparent` header
    parameter, so a caller can propagate a W3C Trace Context trace ID into MyCarrier.
    No response correlation header is documented, so the trace is one-directional
    from the client''s point of view. The FreightAudit payment request also requires
    a caller-supplied `correlationId` (uuid).'
  gaps:
  - No documented response request-id header to quote back to support.
