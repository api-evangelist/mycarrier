authentication:
  style: http-basic
  detail: 'Username = account admin email, password = Order API Key, sent in the
    Authorization header. The FreightAudit live contract and the webhook-registration
    contract declare Bearer JWT instead. The public contract additionally declares an
    optional X-Mc-Api-Key header parameter on every operation alongside Authorization.'
  https_required: true
  see: authentication/mycarrier-authentication.yml
media_types:
  request: application/json
  response: application/json
  note: 'The docs state MyCarrier favours JSON as its standard interchange format.
    Two routing-guide operations return Excel binaries
    (DownloadRoutingGuide, DownloadRoutingGuideTemplate).'
idempotency:
  supported: true
  scope: partial
  mechanism: request-body field
  key_field: idempotencyKey
  key_header: null
  operations:
  - operationId: null
    method: POST
    path: /api/Payment/PayNow
    spec: openapi/mycarrier-freightaudit-api-openapi.json
    schema: MC.Invoice.API.Dtos.Payments.Requests.PayInvoiceRequest
    required: true
    note: 'The pay-invoice request REQUIRES both `idempotencyKey` and `correlationId`.
      This is a genuine, enforced idempotency contract on the money-moving operation.'
  retention: not published
  detail: 'Idempotency is real but NARROW: it is enforced on the invoice payment
    operation only, via a required `idempotencyKey` field in the request body, not via
    a standard Idempotency-Key HTTP header. No other MyCarrier write operation accepts
    an idempotency key.'
  natural_keys:
    supported: true
    detail: 'Order writes are upserts keyed on the caller''s own reference ID —
      UploadOrder is documented as "Create a new order or update existing by Reference
      ID", and both DeleteOrder and Order address the resource by
      /referenceId/{referenceId}. Re-sending the same order payload with the same
      reference ID updates rather than duplicates, which gives order creation
      idempotent-by-natural-key behaviour without an idempotency token.'
  gaps:
  - No Idempotency-Key request header on any operation.
  - No published key retention/replay window.
  - No idempotency on dispatch (DispatchQuote), which is the operation that commits
    freight to a carrier.
pagination:
