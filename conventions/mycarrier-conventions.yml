dry_run_mode:
  supported: partial
  detail: 'There is no dry-run flag, but the domain splits rehearsal from commitment
    across two operations: GetRates (POST /api/v1/quote/rate) prices a shipment without
    committing it, and DispatchQuote (POST /api/v1/quote/dispatch) commits the quote to
    the carrier. An agent can therefore always price before it books. The FreightAudit
    contract also ships explicit validate-before-commit pairs:
    POST /api/BulkImport/Validate before POST /api/BulkImport/Import, and
    POST /api/v2/import/invoices/validate before POST /api/v2/import/invoices.'
reversibility:
  grade: documented
  applicable: true
  detail: 'Reversal paths exist across every write surface, but MyCarrier publishes NO
    time window for any of them, so this grades `documented` rather than `verified`.
    No MyCarrier documentation page states how long an order can be deleted, whether a
    dispatched shipment can be recalled through the API at all, or how long a recorded
    payment can be removed. Nothing here asserts a window, because none is published.'
  surfaces:
  - write_operation: UploadOrder
    method: POST
    path: /api/v1/orders
    reversal_operation: DeleteOrder
    reversal_method: DELETE
    reversal_path: /api/v1/orders/referenceId/{referenceId}
    reversal_type: delete
    window: not published
    docs: https://developer.mycarrier.io/docs/order-management
    note: 'An order can also be superseded rather than deleted, because UploadOrder is
      an upsert on the same reference ID.'
  - write_operation: UpsertRoutingGuide
    method: POST
    path: /api/v1/routing-guide/upsert
    reversal_operation: DeleteRoutingGuide
    reversal_method: DELETE
    reversal_path: /api/v1/routing-guide/delete/{id}
    reversal_type: delete
    window: not published
  - write_operation: DispatchQuote
    method: POST
    path: /api/v1/quote/dispatch
    reversal_operation: null
    reversal_type: none-in-api
    window: not published
    note: 'THE HIGHEST-CONSEQUENCE GAP. DispatchQuote tenders freight to a carrier and
      is the one MyCarrier write with real-world, billable effect, yet the public API
      exposes no cancel or recall operation. MyCarrier clearly supports cancellation —
      it publishes a `shipment.canceled` webhook and the shipment model carries an
      `isCanceled` flag — but the cancellation itself is performed in the MyCarrier UI,
      not through the API. An agent that dispatches cannot undo it programmatically.'
  - write_operation: POST /api/Payment/Record
    reversal_operation: DELETE /api/Payment/DeletePayment
    reversal_type: delete
    window: not published
    spec: openapi/mycarrier-freightaudit-api-openapi.json
  - write_operation: POST /api/Payment/BulkPay
    reversal_operation: DELETE /api/v3/payments/manual-payments
    reversal_type: delete
    window: not published
    spec: openapi/mycarrier-freightaudit-api-openapi.json
  - write_operation: POST /api/Dispute/Save
    reversal_operation: DELETE /api/Dispute/Remove
    reversal_type: delete
    window: not published
    spec: openapi/mycarrier-freightaudit-api-openapi.json
  - write_operation: POST /api/Notes/Save
    reversal_operation: DELETE /api/Notes/Delete
    reversal_type: delete
    window: not published
    spec: openapi/mycarrier-freightaudit-api-openapi.json
  - write_operation: 'PATCH /api/v2/Integrations/Invoices/ArchiveToggle/{type}'
    reversal_operation: 'PATCH /api/v2/Integrations/Invoices/ArchiveToggle/{type}'
    reversal_type: toggle
    window: not published
    note: 'Archive/unarchive is a genuine two-way toggle on one operation. The invoice
      status enum also carries an `InvoiceRestored` activity type, so restore-after-delete
      exists in the domain model, but no public operation performs it.'
  gaps:
  - No published reversal window for any operation.
  - No API-side cancellation of a dispatched shipment.
  - No restore operation despite an `InvoiceRestored` state in the model.
