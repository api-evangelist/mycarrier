  response_fields:
  - name: returnedCount
    description: Number of returned results.
  - name: isTruncated
    description: Indicates whether the results are truncated.
  detail: 'Only the shipping-locations collection is paginated. There is no cursor,
    no total count and no link header; a client learns it has more data from the
    boolean `isTruncated` flag, and must re-request with a larger `skip`.'
