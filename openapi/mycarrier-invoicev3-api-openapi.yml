servers:
- url: https://invoice.mycarriertms.com
tags:
- name: InvoiceV3
paths:
  /api/v3/invoices/filter:
    post:
      tags:
      - InvoiceV3
      parameters:
      - name: Environment
        in: header
        example: dev
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MC.Invoice.API.Dtos.FreightAudit.Requests.InvoiceFilterRequestV2'
          application/*+json:
            schema:
              $ref: '#/components/schemas/MC.Invoice.API.Dtos.FreightAudit.Requests.InvoiceFilterRequestV2'
