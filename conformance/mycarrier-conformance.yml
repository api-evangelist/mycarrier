domain_standards:
- id: nmfta-scac
  name: Standard Carrier Alpha Code (SCAC)
  body: National Motor Freight Traffic Association (NMFTA)
  conforms: true
  evidence: 'Declared throughout the contract as the carrier identifier, not merely
    claimed in marketing prose. openapi/mycarrier-public-api-openapi.json:
    MC.Quote.Contracts.Responses.Rate.ServiceResponse.carrier — "Carrier SCAC (Standard
    Carrier Alpha Code) providing the rate", maxLength 4, example "ABCF"; routing-guide
    rules carry `carrierScac` and "A comma-separated list of carrier SCACs to be
    excluded for this routing guide rule"; the FreightAudit contract routes dispute
    email by SCAC at GET /api/CarrierSettings/DisputeEmail/SCAC/{carrierCode}.'
  significance: 'A shipper or TMS that already speaks SCAC addresses MyCarrier''s
    fourteen carrier partners with no bespoke carrier-code mapping.'
- id: nmfta-nmfc
  name: National Motor Freight Classification (NMFC)
  body: National Motor Freight Traffic Association (NMFTA)
  conforms: true
  evidence: 'Commodity classification is expressed in NMFC, not a MyCarrier-private
    taxonomy. Fields `commodityNMFC` ("An optional non-decimal numeric string ... that
    specifies the commodity NMFC code for a specific commodity in a specific handling
    unit"), `commodityNMFCSubCode` ("NMFC sub-classification code for more specific
    commodity classification"), and in the rating contract `nmfcItemCode` /
    `nmfcSubCode`. The marketing site also lists "NMFC Verification" as a Basic-tier
    feature.'
- id: fmcsa-hazmat
  name: FMCSA hazard classes and UN/NA hazardous material identifiers
  body: 'Federal Motor Carrier Safety Administration; UN Model Regulations / 49 CFR'
  conforms: true
  evidence: 'The handling-unit commodity model carries `hazmatHazardClass` ("the Federal
    Motor Carrier Safety Administration (FMCSA) hazard class"), `hazmatIDNumber` ("using
    the United Nations (UN) or North American (NA) format that specifies the hazardous
    material identifier"), `hazmatPackingGroup` ("the hazardous material packing group
    type indicating the degree of danger") and `hazmatProperShippingName` ("the full
    proper shipping name"). These are the regulated 49 CFR / UN shipping-description
    elements, declared as first-class request fields.'
- id: x12-edi
  name: EDI freight invoicing
  body: ASC X12
  conforms: partial
  evidence: 'The FreightAudit contract exposes an EDI mapping surface —
    POST/DELETE /api/CustomerSettings/EdiMapping with
    MC.Invoice.API.Dtos.CustomerSettings.EdiMappingInformationRequest and the
    MC.Invoice.Data.Mongo.Entities.EdiMapping entity — plus a partner EDI intake at
    POST /api/v1/Integrations/YourEDI/Create
    (YourEDICreateInvoiceRequest). The EDI transaction sets themselves (e.g. 210 freight
    invoice, 214 shipment status) are NOT named in the contract, so this is recorded as
    partial: an EDI mapping capability is demonstrably present, but no specific X12
    transaction set is declared.'
- id: ebol
  name: Electronic Bill of Lading
  conforms: true
  evidence: 'eBOL is a published Basic-tier platform feature, and BOL artifacts are
    first-class in the API: the dispatch response returns `bolNumber`, the shipment
    model exposes `bol` ("The signed Bill Of Lading from the carrier") and `originalBol`
    links, and the shipment.created webhook payload carries a `BOLLink`.'
